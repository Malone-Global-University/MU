<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | Encyclopedia | Malone Global University</title>
  {{DESCRIPTION}}
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="icon" href="/image/global/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/component/lib.css">
  <link rel="stylesheet" href="/component/encyclopedia/article.css">
</head>
<body id="top"{{DATES}}>
  <div id="header-placeholder"></div>
  <script>
  fetch('/component/header.html')
    .then(response => { if (!response.ok) throw new Error('Header unavailable'); return response.text(); })
    .then(data => {
      document.getElementById('header-placeholder').innerHTML = data;
      const script = document.createElement('script');
      script.src = '/component/main.js';
      document.body.appendChild(script);
    }).catch(error => console.error(error));
  </script>
  <section class="hero mgu-encyclopedia-hero" aria-label="Article title">
    {{HEROHEADING}}
    {{HERODESCRIPTION}}
  </section>
  <nav class="breadcrumb" aria-label="Breadcrumb" id="breadcrumb"></nav>
  <main id="main-content" role="main">
    <div class="mgu-encyclopedia-layout">
      {{TOC}}
      <article class="mgu-encyclopedia-article">
        {{BODY}}
      </article>
    </div>
    <div id="bottom-nav-placeholder"></div>
  </main>
  <div id="footer-placeholder"></div>
  <script src="/component/bottom-nav-loader.js" defer></script>
  <script>
  // Keep the TOC independently scrollable; its fixed control resets both positions.
  document.querySelector('[data-meps-back-to-top]')?.addEventListener('click', event => {
    if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    const list = document.querySelector('.mgu-toc-list');
    if (list) list.scrollTop = 0;
    if (location.hash !== '#top') history.pushState(null, '', '#top');
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
  });
  </script>
  <script>
  fetch('/component/footer.html')
    .then(response => { if (!response.ok) throw new Error('Footer unavailable'); return response.text(); })
    .then(data => {
      document.getElementById('footer-placeholder').innerHTML = data;
      const dates = [];
      if (document.body.dataset.uploaded) dates.push('Uploaded: ' + document.body.dataset.uploaded);
      if (document.body.dataset.updated) dates.push('Updated: ' + document.body.dataset.updated);
      const pageDates = document.getElementById('page-dates');
      if (pageDates) pageDates.textContent = dates.join(' | ') || 'Publication dates not recorded';
    }).catch(error => console.error(error));
  </script>
</body>
</html>
