<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="This page delivers dynamically generated dictionary words and thier definitions from 26 json shards as part of the Malone Global University online Library. Users can search for a word at maloneuniversity.org/library/dictionary/religious/index and upon successful search and find it will appear here at maloneuniversity.org/library/dictionary/religious/entry. This is a free service to MGU students and the general public as part of a commitment to quality education and the free exchange of information.">
  <title>Dictionary Entry | MGU Dictionary</title>
  <link rel="icon" href="/image/global/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/component/lib.css" />
</head>
<!-- ========== BODY ========== -->
<body id="top" data-uploaded="8-16-2026" data-updated="8-16-2026">

<!-- ========== HEADER ========== -->
<div id="header-placeholder"></div>
<script>
fetch('/component/header.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('header-placeholder').innerHTML = data;

    const script = document.createElement('script');
    script.src = '/component/main.js';
    document.body.appendChild(script);
  });
</script> 

<!-- ========== HERO ========== -->
<section class="hero">
<h1>Malone Global University Dictionary</h1>
    <p>Authoritative definitions for students, faculty, and the public.</p>
  </section>

<!--  ======== BREADCRUMB ======== -->
<nav class="breadcrumb" aria-label="Breadcrumb" id="breadcrumb"></nav>

<!--  ======== Main ======== -->
<main id="main-content" role="main">

<section>
  <div id="entry"></div>
</section>
<!-- ========== BOTTOM PAGE NAVIGATION ========== -->
<div id="bottom-nav-placeholder"></div>
</main>

<!-- ========== FOOTER ========== -->
<div id="footer-placeholder"></div>

<script>
fetch('/component/bottom-nav.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('bottom-nav-placeholder').innerHTML = data;
  });

fetch('/component/footer.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('footer-placeholder').innerHTML = data;

    const uploaded = document.body.dataset.uploaded;
    const updated = document.body.dataset.updated;

    const pageDates = document.getElementById('page-dates');

    if (pageDates) {
      pageDates.textContent = `Uploaded: ${uploaded} | Updated: ${updated}`;
    }
  });
</script>
<script src="/library/dictionary/religious/entry.js"></script>
</body>
</html>
