<!DOCTYPE html>
<html lang="en">

 <!-- ========== HEAD ========== -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title>Title | Department Name | Malone Global University</title>
  <link rel="icon" href="/image/global/favicon.ico" type="image/x-icon">

<!-- ========== STYLESHEET ========== -->
  <link rel="stylesheet" href="/component/.css">

<!-- ========== MGU webpages are assigned color-coded sub-domains of /department (blue pages), /library (red pages), /community (green pages), /news (purple pages),and the root folder / (dark teal pages). This plays off phone books that have yellow page for business and blue pages for government, it shows what type of address you are connecting to. Likewise the subdomians all carry the same stylsheet CSS except for color of header and hotlinks. This subtle but dramatic change creates the different themes MGU pages use.  Pages use abbrevations for their CSS sheets. Department.css becomes dept.css, library.css becomes lib.css, community becomes com.css, and News.css is simply news.css. The main pages are less than 12 and are reserved for the main page of the entire site /index.html, root level orientation pages, and custom 200 and under construction pages. Use dept.css, lib.css, com.css, or news.css based on what subdomain the page lives. In the unlikely event that a page is not under those subdomain fall back to the default main.css.   ========== -->

</head>

<!-- ========== BODY ========== -->
<body id="top" data-uploaded="yyyy-mm-dd" data-updated="11-22-2026">

<!-- ========== HEADER ========== -->
<div id="header-placeholder"></div>
<script>
fetch('/component/header.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('header-placeholder').innerHTML = data;

    const script = document.createElement('script');
    script.src = '/component/main.js';
    document.body.appendChild(script);
  });
</script> 

<!-- ========== HERO ========== -->
<section class="hero">
<h1></h1>
</section>

<!--  ======== BREADCRUMB ======== -->
<nav class="breadcrumb" aria-label="Breadcrumb" id="breadcrumb"></nav>

<!--  ======== MAIN ======== -->
<main id="main-content" role="main">

<!-- ========== BOTTOM PAGE NAVIGATION ========== -->
<div id="bottom-nav-placeholder"></div>
</main>

<!-- ========== FOOTER ========== -->
<div id="footer-placeholder"></div>

<!-- ========== COMPONENT SCRIPTS ========== -->
<!-- ========== SHARED BOTTOM NAVIGATION LOADER ========== -->
<script src="/component/bottom-nav-loader.js" defer></script>

<!-- ========== FOOTER LOADER ========== -->
<script>
fetch('/component/footer.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('footer-placeholder').innerHTML = data;

    const uploaded = document.body.dataset.uploaded;
    const updated = document.body.dataset.updated;

    const pageDates = document.getElementById('page-dates');

    if (pageDates) {
      pageDates.textContent =
        `Uploaded: ${uploaded} | Updated: ${updated}`;
    }
  });
</script>
</body>
</html>
